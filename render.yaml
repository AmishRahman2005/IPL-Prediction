services:
  # FastAPI backend
  - type: web
    name: ipl-dynasty-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PORT
        value: 8000

  # React frontend (Static Site)
  - type: web
    name: ipl-dynasty-frontend
    env: static
    buildCommand: npm install && npm run build
    publishDir: dist
    plan: free
    headers:
      - path: /*
        name: Cache-Control
        value: max-age=31536000
