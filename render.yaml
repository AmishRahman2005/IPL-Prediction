services:
  # FastAPI backend
  - type: web
    name: ipl-dynasty-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8000

  # React frontend (Static Site)
  - type: web
    name: ipl-dynasty-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ipl-dynasty-backend
          property: host
    headers:
      - path: /*
        name: Cache-Control
        value: max-age=31536000
